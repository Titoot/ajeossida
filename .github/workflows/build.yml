name: Build ajeossida-frida (bridge-patched)

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: "Frida tag to build (anchors verified for 17.9.1; other tags fail loudly)"
        required: false
        default: "17.9.1"
  push:
    branches: [ main ]
  pull_request:

env:
  CUSTOM_NAME: ajeossida
  # Empty on push/PR events -> falls back to the 17.9.1 default in the script
  FRIDA_VERSION: ${{ github.event.inputs.frida_version || '17.9.1' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # -----------------------------
      # Checkout repo
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # -----------------------------
      # Install system dependencies
      # -----------------------------
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3 python3-pip \
            git curl wget unzip \
            build-essential \
            pkg-config \
            ninja-build \
            meson \
            flex bison \
            libc6-dev \
            libglib2.0-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            clang lld

      # -----------------------------
      # Python dependencies
      # -----------------------------
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install requests

      # -----------------------------
      # Increase file limits (Frida build stability)
      # -----------------------------
      - name: Increase ulimit
        run: |
          ulimit -n 1048576 || true

      # -----------------------------
      # Guard: the bridge patch module must be present
      # (main_ubuntu_android.py imports it right before the first build)
      # -----------------------------
      - name: Verify bridge patch module present
        run: |
          test -f patch_java_bridge.py || { \
            echo "::error::patch_java_bridge.py missing from repo root"; exit 1; }

      # -----------------------------
      # Run your build script (applies frida-java-bridge P1-P5 itself)
      # -----------------------------
      - name: Run Frida custom build
        run: |
          python3 main_ubuntu_android.py

      # -----------------------------
      # The in-script patch asserts anchors; this grep makes CI fail loudly
      # if the patched source doesn't carry our markers (never ship silent)
      # -----------------------------
      - name: Sanity-check bridge patches applied
        run: |
          if grep -rq "ajeossida: no libart text hooks" \
              ajeossida/subprojects/frida-java-bridge/lib/android.js; then
            echo "[ci] bridge patch markers present in vendored source"
          else
            echo "::error::bridge patch markers missing — patch step did not run"
            exit 1
          fi

      # -----------------------------
      # Checksums
      # -----------------------------
      - name: Generate checksums
        run: |
          cd assets && sha256sum * > checksums.txt && cat checksums.txt

      # -----------------------------
      # Upload build artifacts
      # -----------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ajeossida-frida-build-bridge-${{ env.FRIDA_VERSION }}
          path: assets/
